spring.application.name=ExpenseTracker

# load local secrets from .env when present (git-ignored)
spring.config.import=optional:file:.env[.properties]

# --- PostgreSQL ---
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:expensetracker}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# use "validate" once you introduce Flyway or Liquibase migrations
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- JWT ---
# base64 secret, at least 256 bits for HS256. Value comes from .env or a real env var. No default on purpose:
# the app must fail to start rather than run on a hardcoded key.
app.jwt.secret=${JWT_SECRET}
# access token lifetime in milliseconds (1 hour)
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# --- Logging ---
logging.level.org.springframework.security=INFO
